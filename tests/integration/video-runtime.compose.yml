# Isolated, egress-disabled verification. Never merge with business Compose files.
services:
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: comicflow_verify
      POSTGRES_USER: verify
      POSTGRES_PASSWORD: verification-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U verify -d comicflow_verify]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    pull_policy: never
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: never
    command: server /data
    environment:
      MINIO_ROOT_USER: verification
      MINIO_ROOT_PASSWORD: verification-only
    tmpfs:
      - /data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 2s
      timeout: 2s
      retries: 20
  verify:
    image: comicflow-api:latest
    pull_policy: never
    entrypoint: [/app/.venv/bin/python, /workspace/tests/integration/verify_video_runtime.py]
    working_dir: /verification
    environment:
      PYTHONPATH: /workspace/backend/src
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../..:/workspace:ro
      - ${COMICFLOW_VERIFY_OUTPUT:-../../var/verification/video-module-split-20260919}:/verification
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
networks:
  default:
    internal: true
