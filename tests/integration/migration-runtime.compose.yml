# Dedicated synthetic services; no business volumes, .env, consumers or Docker socket.
services:
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: synthetic-migration-only
      POSTGRES_DB: migration_source
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U migration -d migration_source]
      interval: 2s
      timeout: 2s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: never
    command: server /data
    environment:
      MINIO_ROOT_USER: migration
      MINIO_ROOT_PASSWORD: synthetic-migration-only
    tmpfs: [/data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    pull_policy: never
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 20
  proxy:
    image: comicflow-api:latest
    pull_policy: never
    entrypoint: [/app/.venv/bin/python, /proxy.py]
    volumes:
      - ./migration_port_proxy.py:/proxy.py:ro
    ports: ["127.0.0.1::15432", "127.0.0.1::19000", "127.0.0.1::16379"]
    networks: [default, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
networks:
  default:
    internal: true
  edge: {}
