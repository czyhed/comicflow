server {
    listen 80;
    server_name _;
    client_max_body_size 40m;
    location /api/ {
        proxy_pass http://verify:18098;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /health { proxy_pass http://verify:18098; }
    location /test-control/ { proxy_pass http://verify:18099; }
    location /comicflow-verify/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
