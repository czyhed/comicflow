server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Resolve again after the backend is recreated by its independent pipeline.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://comicflow-api:8000;
    set $objects http://comicflow-objects:9000;

    location = /nginx-health {
        access_log off;
        return 200 'ok';
    }
    location ~ ^/(api(?:/|$)|health$) {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_next_upstream off;
    }
    # Keep the path/query and original signing host for presigned S3 URLs.
    location /comicflow/ {
        proxy_pass $objects$request_uri;
        proxy_set_header Host object-store:9000;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_next_upstream off;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache';
    }
}
