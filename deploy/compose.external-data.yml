# Standalone application stack: external PostgreSQL / Redis / S3 only.
# From the repository root, always use --env-file .env.server with this file.
# Do not merge with docker-compose.yml or compose.backend.yml.
x-runtime: &runtime
  image: comicflow-backend:${APP_VERSION:-external-local}
  build:
    context: ..
    dockerfile: backend/Dockerfile
  env_file:
    - ../.env.server
  environment:
    COMICFLOW_RUNTIME: postgresql
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.server}
    REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.server}
    COMICFLOW_REDIS_NAMESPACE: ${COMICFLOW_REDIS_NAMESPACE:?Set a unique Redis namespace in .env.server}
    S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in .env.server}
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT in .env.server}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env.server}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.server}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.server}
    EXPORT_DOWNLOAD_SECRET: ${EXPORT_DOWNLOAD_SECRET:?Set EXPORT_DOWNLOAD_SECRET in .env.server}
    MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-}
    MODEL_CONFIG_KEY_FILE: /app/var/config/model-config.key
    EXPORT_OUTPUT_DIR: /app/var/exports
  volumes:
    - model-config:/app/var/config
  restart: unless-stopped

services:
  api:
    <<: *runtime
    command: ["uvicorn", "comicflow.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    # A second local API for validation; does not take over the existing 18001 API.
    ports: ["127.0.0.1:${EXTERNAL_API_PORT:-18002}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *runtime
    profiles: [workers]
    command: ["celery", "-A", "comicflow.worker.celery_app:celery_app", "worker", "--loglevel=INFO"]
  beat:
    <<: *runtime
    profiles: [scheduler]
    command: ["celery", "-A", "comicflow.worker.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/app/var/celerybeat-schedule"]
    volumes:
      - beat-state:/app/var
      - model-config:/app/var/config
  migrate:
    <<: *runtime
    profiles: [setup]
    command: ["alembic", "upgrade", "head"]
    restart: "no"

volumes:
  model-config:
  beat-state:
